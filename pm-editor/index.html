<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marginal — ProseMirror prototype</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; font-family: Georgia, 'Times New Roman', serif; background: #f6f5f2; color: #1a1a1a; }
      .app-shell { max-width: 820px; margin: 0 auto; padding: 24px 24px 120px; }
      h1.page-title { font-family: -apple-system, system-ui, sans-serif; font-size: 20px; margin: 0 0 4px; }
      p.page-subtitle { font-family: -apple-system, system-ui, sans-serif; font-size: 13px; color: #666; margin: 0 0 20px; }
      .toolbar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 6px; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 8px; margin-bottom: 16px; font-family: -apple-system, system-ui, sans-serif; }
      .toolbar button { font-family: inherit; font-size: 13px; padding: 5px 10px; border: 1px solid #ccc; border-radius: 6px; background: #fafafa; cursor: pointer; }
      .toolbar button:hover { background: #eee; }
      .toolbar button:disabled { opacity: 0.4; cursor: default; }
      .toolbar .divider { width: 1px; background: #ddd; margin: 2px 4px; }
      #editor { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 32px 40px; min-height: 400px; }
      .ProseMirror { outline: none; line-height: 1.6; white-space: pre-wrap; }
      .ProseMirror section { border-left: 3px solid #e3e1db; padding-left: 18px; margin: 18px 0; }
      .ProseMirror section section { border-left-color: #d6d3ca; }
      .ProseMirror h2.section-title { font-family: -apple-system, system-ui, sans-serif; font-size: 18px; margin: 0 0 8px; }
      .ProseMirror section section h2.section-title { font-size: 15px; }
      .ProseMirror section section section h2.section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; }
      .ProseMirror blockquote { border-left: 3px solid #999; margin: 1em 0; padding-left: 1em; color: #444; }
      .pm-citation { background: #eef3ff; color: #2452b3; border-radius: 4px; padding: 0 3px; cursor: pointer; }
      .pm-footnote-marker { color: #b3552e; cursor: pointer; font-weight: 700; padding: 0 1px; }
      .pm-footnote-body { background: #fff6ec; border: 1px dashed #e0b98c; border-radius: 4px; padding: 0 6px; margin: 0 2px; font-size: 0.92em; }
      .pm-math { font-family: 'Courier New', monospace; background: #f1f1f6; border-radius: 4px; padding: 0 4px; cursor: pointer; }
      .pm-math-block { display: block; padding: 8px 12px; margin: 10px 0; text-align: center; }
      comment-anchor { background: #fff3b0; border-radius: 2px; }
      a { color: #2452b3; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
